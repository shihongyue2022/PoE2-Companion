name: Workbench CI

on:
  push:
    branches: [main, beta]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Check workbench, engine and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Type check applications and engine packages
        run: npm run type-check && npm run type-check:engine && npm run type-check:optimizer
      - name: Lint workbench and local bridge
        run: npx eslint src/workbench tools/workbenchServer.ts tools/workbenchServer.test.ts tools/tradeLog.ts tools/tradeLog.test.ts browser-extension/official-history/*.js
      - name: Workbench regression tests
        run: npx vitest run src/workbench tools/workbenchServer.test.ts tools/tradeLog.test.ts tools/affixReference.test.ts --maxWorkers=2
      - name: Extension boundary regression
        run: node scripts/workbench-official-history-extension-regression.mjs
      - name: Production build
        run: npm run build
